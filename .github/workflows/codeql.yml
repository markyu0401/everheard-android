name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Fork PRs get a read-only token, so the SARIF upload would fail. Skip them;
    # same-repo PRs and main-branch pushes are analyzed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Cache native AAR
        uses: actions/cache@v6
        with:
          path: app/libs/sherpa-onnx-2.0.0.aar
          key: sherpa-${{ hashFiles('scripts/fetch_sherpa.sh') }}

      - name: Fetch native AAR
        run: bash scripts/fetch_sherpa.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build debug APK for analysis
        run: ./gradlew --no-daemon assembleDebug -x lint -x test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
