name: Release build check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Cache models and native AAR
        uses: actions/cache@v6
        with:
          path: |
            app/libs/sherpa-onnx-2.0.0.aar
            app/src/main/assets/models/asr-small
            app/src/main/assets/models/sense-voice
            app/src/main/assets/models/speaker
          key: models-${{ hashFiles('scripts/fetch_models.sh', 'scripts/fetch_sherpa.sh') }}

      - name: Fetch native dependencies
        run: |
          bash scripts/fetch_sherpa.sh
          bash scripts/fetch_models.sh

      - name: Assemble release (unsigned)
        run: ./gradlew --no-daemon lintVitalRelease assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: everheard-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
